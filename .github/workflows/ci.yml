name: CI pipeline

on:
  push:
   branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12.7'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main script
        run: python main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: app

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test.py

  scan:
    runs-on: ubuntu-latest
    needs: build
    # Job-level permissions REPLACE the workflow-level block, so contents: read is repeated
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      SCAN_IMAGE: ci-scan:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build locally only (load into runner's docker daemon), nothing is pushed
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.SCAN_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate: prints a findings table in this step's log and fails the job on HIGH/CRITICAL
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # Report: same scan as SARIF for the Security tab. Runs even when the gate failed;
      # trivy and its DB are already on the runner, so this is a quick rescan.
      - name: Generate Trivy SARIF
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
          skip-setup-trivy: true

      - name: Upload SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: warn

      # Skip if trivy crashed before writing the file, otherwise this step fails too and hides the real error
      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image # separates these alerts from other SARIF tools (e.g. CodeQL)

  deploy:
    needs: [test, scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Setting up ${{ github.sha }}"