name: envs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Build artifact
        run: |
          echo "App build artifact" > artifact.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-artifact
          path: artifact.txt

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: app-artifact
      
      - name: Deploy to dev
        run: |
          echo "Deploying to dev"
          cat artifact.txt
          echo "APP_ENV: ${{ vars.APP_ENV }}"

  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: app-artifact
      
      - name: Deploy to test
        run: |
          echo "Deploying to test"
          cat artifact.txt
          echo "APP_ENV: ${{ vars.APP_ENV }}"

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: app-artifact
      
      - name: Deploy to prod
        run: |
          echo "Deploying to prod"
          cat artifact.txt
          echo "APP_ENV: ${{ vars.APP_ENV }}"