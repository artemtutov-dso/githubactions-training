name: matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os}}
    strategy:
      fail-fast: false 
      matrix:
        version: [3.12.7, 3.12.6, 3.12.5, 3.12.4, 3.12.3]
        os: [ubuntu-latest]
        exclude:
          - os: ubuntu-latest
            version: '3.12.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version  }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main script
        run: python main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-python-${{ matrix.version}}
          path: .

  test:
    runs-on: ${{ matrix.os}}
    needs: build
    strategy:
      fail-fast: false 
      matrix:
        version: [3.12.7, 3.12.6, 3.12.5, 3.12.4]
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            version: '3.12.3'
            experimental: true

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: app-python-${{ matrix.version}}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version  }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test.py

      - name: Run experimental something
        if: matrix.experimental == true
        run: echo "Running experimental thingie"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Setting up ${{ github.sha }}"